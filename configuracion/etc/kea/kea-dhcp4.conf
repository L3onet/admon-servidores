// AVISO: valores de ejemplo (dominio leonel.mx, red 192.168.50.0/24). Sustitúyelos por tu dominio y tu octeto.
{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [ "enp0s9" ]
    },

    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/run/kea/kea4-ctrl-socket"
    },

    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases4.csv",
      "lfc-interval": 3600
    },

    "renew-timer": 900,
    "rebind-timer": 1800,
    "valid-lifetime": 3600,
    "authoritative": false,

    "dhcp-ddns": { "enable-updates": true },
    "ddns-send-updates": true,
    "ddns-qualifying-suffix": "leonel.mx.",
    "ddns-override-client-update": true,
    "ddns-replace-client-name": "when-not-present",
    "ddns-generated-prefix": "cliente",

    "option-data": [
      { "name": "domain-name-servers", "data": "192.168.50.1" },
      { "name": "domain-name",         "data": "leonel.mx" },
      { "name": "domain-search",       "data": "leonel.mx" }
    ],

    "subnet4": [
      {
        "id": 1,
        "subnet": "192.168.50.0/24",
        "pools": [
          {
            "pool": "192.168.50.100 - 192.168.50.200",
            "client-classes": [ "KNOWN" ]
          }
        ],
        "option-data": [
          { "name": "routers", "data": "192.168.50.1" }
        ],
        "reservations": [
          {
            "hw-address": "08:00:27:aa:bb:cc",
            "ip-address": "192.168.50.50",
            "hostname": "cliente-fijo"
          },
          {
            "hw-address": "08:00:27:dd:ee:ff",
            "hostname": "cliente-02"
          }
        ]
      }
    ],

    "loggers": [
      {
        "name": "kea-dhcp4",
        "output-options": [
          { "output": "/var/log/kea/kea-dhcp4.log" }
        ],
        "severity": "INFO"
      }
    ]
  }
}
