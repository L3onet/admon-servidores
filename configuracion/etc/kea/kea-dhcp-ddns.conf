// AVISO: reemplaza PEGA_AQUI_EL_SECRET por el 'secret' de /etc/bind/kea-ddns.key y ajusta dominio/octeto.
{
  "DhcpDdns": {
    "ip-address": "127.0.0.1",
    "port": 53001,

    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/run/kea/kea-ddns-ctrl-socket"
    },

    "tsig-keys": [
      {
        "name": "kea-ddns",
        "algorithm": "HMAC-SHA256",
        "secret": "PEGA_AQUI_EL_SECRET"
      }
    ],

    "forward-ddns": {
      "ddns-domains": [
        {
          "name": "leonel.mx.",
          "key-name": "kea-ddns",
          "dns-servers": [ { "ip-address": "127.0.0.1", "port": 53 } ]
        }
      ]
    },

    "reverse-ddns": {
      "ddns-domains": [
        {
          "name": "50.168.192.in-addr.arpa.",
          "key-name": "kea-ddns",
          "dns-servers": [ { "ip-address": "127.0.0.1", "port": 53 } ]
        }
      ]
    },

    "loggers": [
      {
        "name": "kea-dhcp-ddns",
        "output-options": [ { "output": "/var/log/kea/kea-dhcp-ddns.log" } ],
        "severity": "INFO"
      }
    ]
  }
}
