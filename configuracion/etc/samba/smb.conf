# AVISO: 'hosts allow' usa la red de ejemplo 192.168.1.0/24; escribe tu red real.
[global]
   printing = cups
   printcap name = cups
   load printers = no
   workgroup = WORKGROUP
   server string = Servidor de laboratorio
   server role = standalone server
   security = user
   passdb backend = tdbsam

   # Seguridad
   map to guest = never
   restrict anonymous = 2
   server min protocol = SMB3
   disable netbios = yes
   smb ports = 445
   hosts allow = 127.0.0.1 192.168.1.0/24
   hosts deny  = 0.0.0.0/0

   # Registros
   logging = file
   log file = /var/log/samba/log.%m
   max log size = 1000


[publico]
   comment = Material del curso
   path = /srv/samba/publico
   valid users = @docentes @alumnos
   read only = yes
   write list = @docentes
   create mask = 0664
   directory mask = 2775

[docentes]
   comment = Solo docentes
   path = /srv/samba/docentes
   valid users = @docentes
   read only = no
   force group = docentes
   create mask = 0660
   directory mask = 2770

[entregas]
   comment = Entrega de tareas
   path = /srv/samba/entregas
   valid users = @alumnos @docentes
   read only = no
   force group = alumnos
   create mask = 0660
   directory mask = 2770

[USB_Lab]
   comment = Impresora USB del laboratorio
   path = /var/spool/samba
   printable = yes
   printer name = USB_Lab
   valid users = @docentes
   guest ok = no
   browseable = yes
