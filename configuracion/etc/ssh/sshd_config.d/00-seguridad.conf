# AVISO: 'AllowUsers leonel' es un ejemplo; cámbialo por tus usuarios.
# --- Autenticación ---
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey

# --- Usuarios permitidos (cambia por los tuyos) ---
AllowUsers leonel

# --- Límites ---
MaxAuthTries 3
LoginGraceTime 30
MaxSessions 5

# --- Sesiones inactivas: desconecta tras ~10 min sin respuesta ---
ClientAliveInterval 300
ClientAliveCountMax 2

# --- Funciones que un servidor normalmente no necesita ---
X11Forwarding no
PermitUserEnvironment no
