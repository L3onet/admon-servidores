# AVISO: IPs y dominio de ejemplo (192.168.1.50, 192.168.50.0/24, leonel.mx); usa tu octeto y dominio.
network:
  version: 2
  ethernets:
    enp0s3:              # Adaptador 1 - NAT (desconectado en esta práctica)
      optional: true
      dhcp4: true
    enp0s8:              # Adaptador 2 - Puente: red de prácticas 192.168.1.0/24
      dhcp4: false
      addresses:
        - 192.168.1.50/24
    enp0s9:              # Adaptador 3 - Puente: red DHCP y DNS del laboratorio
      dhcp4: false
      addresses:
        - 192.168.50.1/24
      nameservers:
        addresses: [192.168.50.1]
        search: [leonel.mx]
